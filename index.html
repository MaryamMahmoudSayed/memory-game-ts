<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css.css" />
    <title>Memory Game</title>
  </head>
  <body>
    <div
      id="content"
      class="container text-center bg-white bg-opacity-50 p-3 rounded shadow"
    >
      <h1
        class="my-2 p-1 rounded bg-danger bg-opacity-20 text-center fw-bold"
        style="
          font-family: 'Comic Sans MS', cursive, sans-serif;
          color: #fde0d2;
        "
      >
        Memory Game
      </h1>

      <div class="progress mb-3">
        <div
          id="progress"
          class="progress-bar progress-bar-striped progress-bar-animated"
          role="progressbar"
          style="width: 0%"
          aria-valuenow="0"
          aria-valuemin="0"
          aria-valuemax="100"
        >
          0%
        </div>
      </div>
      <div
        id="cards"
        class="d-flex flex-wrap justify-content-center gap-2"
      ></div>
      <button id="restartBtn" class="btn btn-danger fw-bold my-3">
        Restart Game
      </button>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
